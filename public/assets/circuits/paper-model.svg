<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Paper inspired model circuit">
  <rect width="720" height="420" rx="28" fill="#081421"/>
  <text x="34" y="44" fill="#edf5ff" font-family="Space Grotesk, sans-serif" font-size="24">Farhi-Neven classifier architecture</text>
  <text x="34" y="68" fill="#9bb0c5" font-family="IBM Plex Mono, monospace" font-size="13">classical bit string plus readout qubit entering a trainable unitary</text>
  <g stroke="rgba(255,255,255,0.22)" stroke-width="3">
    <line x1="136" y1="120" x2="640" y2="120"/>
    <line x1="136" y1="180" x2="640" y2="180"/>
    <line x1="136" y1="240" x2="640" y2="240"/>
    <line x1="136" y1="300" x2="640" y2="300"/>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="14" fill="#9bb0c5">
    <text x="36" y="125">|z1&gt;</text>
    <text x="36" y="185">|z2&gt;</text>
    <text x="36" y="245">|z3&gt;</text>
    <text x="36" y="305">|1&gt;</text>
  </g>
  <g>
    <rect x="202" y="98" width="70" height="44" rx="14" fill="rgba(120,233,255,0.1)" stroke="#78e9ff"/>
    <rect x="202" y="158" width="70" height="44" rx="14" fill="rgba(120,233,255,0.1)" stroke="#78e9ff"/>
    <rect x="202" y="218" width="70" height="44" rx="14" fill="rgba(120,233,255,0.1)" stroke="#78e9ff"/>
    <rect x="202" y="278" width="70" height="44" rx="14" fill="rgba(255,149,166,0.1)" stroke="#ff95a6"/>
    <text x="237" y="126" text-anchor="middle" fill="#78e9ff" font-family="IBM Plex Mono, monospace" font-size="14">x</text>
    <text x="237" y="186" text-anchor="middle" fill="#78e9ff" font-family="IBM Plex Mono, monospace" font-size="14">x</text>
    <text x="237" y="246" text-anchor="middle" fill="#78e9ff" font-family="IBM Plex Mono, monospace" font-size="14">x</text>
    <text x="237" y="306" text-anchor="middle" fill="#ff95a6" font-family="IBM Plex Mono, monospace" font-size="14">readout</text>
  </g>
  <g>
    <line x1="332" y1="120" x2="332" y2="300" stroke="#6de0bb" stroke-width="3" stroke-dasharray="6 8"/>
    <circle cx="332" cy="120" r="7" fill="#6de0bb"/>
    <circle cx="332" cy="180" r="7" fill="#6de0bb"/>
    <circle cx="332" cy="240" r="7" fill="#6de0bb"/>
    <circle cx="332" cy="300" r="7" fill="#6de0bb"/>
  </g>
  <rect x="390" y="88" width="158" height="244" rx="26" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.16)"/>
  <text x="469" y="140" text-anchor="middle" fill="#edf5ff" font-family="Space Grotesk, sans-serif" font-size="26">U(theta)</text>
  <text x="469" y="172" text-anchor="middle" fill="#9bb0c5" font-family="IBM Plex Mono, monospace" font-size="13">parameterized unitary</text>
  <text x="469" y="222" text-anchor="middle" fill="#78e9ff" font-family="IBM Plex Mono, monospace" font-size="14">learnable circuit</text>
  <text x="469" y="252" text-anchor="middle" fill="#ffd36b" font-family="IBM Plex Mono, monospace" font-size="14">can entangle qubits</text>
  <text x="469" y="282" text-anchor="middle" fill="#ff95a6" font-family="IBM Plex Mono, monospace" font-size="14">sets readout label</text>
  <line x1="578" y1="300" x2="630" y2="300" stroke="#ff95a6" stroke-width="4"/>
  <path d="M630 300 l-12 -12 M630 300 l-12 12" stroke="#ff95a6" stroke-width="4" fill="none"/>
  <text x="596" y="334" fill="#edf5ff" font-family="IBM Plex Mono, monospace" font-size="13">measure Y</text>
</svg>
